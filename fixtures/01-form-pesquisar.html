function comboSelect(combo,key) {
  var err = window.onerror; window.onerror = new Function('return true');
  if (!combo) return; combo.selectedIndex=-1; for (var i = 0; i < combo.options.length; i++) {
    if (combo.multiple)
      combo.options[i].selected=((","+key+",").indexOf(","+combo.options[i].value+",") != -1);
    else
      combo.options[i].selected=(combo.options[i].value == key);}window.onerror = err;
}

function popularSubSecao(id){

  evt.populateCombo("evtSubSecao", document.getElementsByName('tmp.diario.cd_secao')[0],'cd_secao','dc_secao');
}

         '_blank', 'scrollbars=no,status=yes, resizable=yes');
}

         '&tmp.diario.pal_chave=' + frm["tmp.diario.pal_chave"].value, 
         '_blank', 'scrollbars=no,status=yes, resizable=yes');
}

//-----------------------------------------------------------------
function separaData(data,retorno){
//data no formato dd/MM/yyy e retorno igual a "D", "M" ou "Y"
 var str = new String(data);
 var dia = str.substring(0,2);
 var mes = str.substring(3,5);
 var ano = str.substr(6);
 if (retorno == "D") return dia;
 if (retorno == "M") return mes;
 if (retorno == "Y") return ano;
}

function diferencaDias(data1,data2) {
//datas no formato dd/MM/yyyy
 var dia1 = separaData(data1,"D");
 var mes1 = separaData(data1,"M");
 var mes1 = Math.floor(mes1)-1;
 var ano1 = separaData(data1,"Y");
 var dt1 = new Date(ano1,mes1,dia1);

 var dia2 = separaData(data2,"D");
 var mes2 = separaData(data2,"M");
 var mes2 = Math.floor(mes2)-1;
 var ano2 = separaData(data2,"Y");
 var dt2 = new Date(ano2,mes2,dia2);

 var diferenca = dt1.getTime() - dt2.getTime();
 var diferenca = Math.floor(diferenca / (1000 * 60 * 60 * 24));
 return diferenca;
}

function chkRequiredCombo(frm, msg){
  if (!msg || msg == "")
  msg = "Campo obrigatório não preenchido";
  var combo = frm.getElementsByTagName('SELECT');
  for (var i = 0; i < combo.length; i++)
  if (combo[i].getAttribute("REQUIRED") == "true")
  if (combo[i].value == -1){
  alert(msg);
  combo[i].focus();
  return false;
  }
  return true;
}

function gravar() {
  var frm = document.forms[0];
  if (chkRequired(frm) && chkRequiredCombo(frm)){
    frm.target = "_self";
    frm.action = 'pesquisar.wsp';
    frm.submit();
  }
}

function executarPesq(){
  var dtIni = document.getElementsByName("tmp.diario.dt_inicio")[0];
  var dtFim = document.getElementsByName("tmp.diario.dt_fim")[0];

  if (dtFim.value != '' && dtIni.value != ''){
    if (diferencaDias(dtFim.value ,dtIni.value) < 0){
      alert('Data inicial não pode ser posterior à data final');
      dtIni.select();
      return false;
    }

    if (diferencaDias(dtFim.value ,dtIni.value) > 30){
      alert('Intervalo máximo de 30 dias');
      dtIni.select();
      return false;
    }
  }

  gravar();
}
