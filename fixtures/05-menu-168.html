function show() {

}

function getKey(page) {
   links = document.links;
   for (var i=0; i<links.length;  i++) {
      href = links[i].href;
      var ix = 0;
      if ((ix = href.indexOf("abre('"+page+"'")) > -1) {
         href = href.substring(19);
         href = href.substring(0,href.indexOf("'"));
         return href;
         break;
      }
   }
}
